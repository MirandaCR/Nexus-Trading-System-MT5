<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Nexus Trader tab icon: the header's neon-green Zap bolt on the app's
       dark surface. Filled (not stroked) so it stays legible at 16px. -->
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none"
        stroke="#22c55e" stroke-opacity="0.35" stroke-width="1"/>

  <!-- lucide "zap" polygon, scaled from its 24px grid and centred -->
  <g transform="translate(4 4)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
             fill="url(#bolt)"
             stroke="url(#bolt)"
             stroke-width="1.6"
             stroke-linejoin="round"/>
  </g>
</svg>
